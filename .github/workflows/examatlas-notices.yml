name: ExamAtlas official notices

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2,14 * * *' # Twice daily UTC (07:55 and 19:55 IST)
  push:
    branches: [master]
    paths:
      - 'public/examatlas-india/scripts/sync_notices.py'
      - '.github/workflows/examatlas-notices.yml'
      - 'public/examatlas-india/scripts/notice_intelligence.py'

permissions:
  contents: write

concurrency:
  group: examatlas-official-notices
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'pypdf>=5,<7'
      - name: Verify notice parser
        run: python -m unittest discover -s public/examatlas-india/scripts -p "test_*.py"
      - name: Scan official notice pages
        run: python public/examatlas-india/scripts/sync_notices.py
      - name: Detect possible official document text revisions
        run: python public/examatlas-india/scripts/notice_intelligence.py
      - name: Save notices snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/examatlas-india/notices.json public/examatlas-india/notice-intelligence.json public/examatlas-india/notice-snapshots.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh ExamAtlas official notice feed [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      # Workflow-token commits don't trigger other workflows, so publish the
      # resulting React build directly here too (retains the existing portfolio).
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Build existing portfolio + ExamAtlas static folder
        run: |
          npm ci
          npm run build
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
